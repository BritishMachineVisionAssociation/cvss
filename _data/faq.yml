questions:
  # --- Before you register ---
  - question: "What prior experience should attendees have?"
    answer: "The required background knowledge is what would be covered in a level 3 undergraduate programme, specifically in the areas of computer vision and deep learning. Attendees are expected to know the basics of neural networks, backpropagation, deep learning architectures, computer vision topics like edge features, contours, feature points, stereo vision and similar."
  - question: "Can I attend online (virtually)?"
    answer: "The summer school is an in-person event as we want to encourage networking and socialising between attendees and presenters, which is a key part of the experience. We are unable to offer virtual attendance options for this event."
  - question: "Do you provide Academic Credits / ECTS?"
    answer: "<p>The summer school itself does not offer formal academic credit or ECTS. As it is a short external training event rather than a credit-bearing university module, any formal recognition would need to be decided by your home institution.</p><p>That said, in previous years, our attendees have been able to obtain recognition or formal credit from their own universities, for example as part of their PhD training or doctoral development activities.</p><p>To support this process, we can provide a certificate of participation confirming attendance, and we can also include the total number of hours attended if this would be helpful for your department or graduate school.</p>"
  - question: "Are companies welcome to send staff?"
    answer: "Yes, companies are welcome to send staff to the summer school. Please note the payment conditions."
  - question: "I'm facing some financial limitations. I was wondering if any fellowships or grant options are available to help cover the costs?"
    answer: "Unfortunately, there is no additional budget to fund travel and accommodation and the price that is offered now is already subsidised by the British Machine Vision Association."
  - question: "Can I volunteer to get reduced/free registration?"
    answer: "Volunteers are by invite only and are usually students from the host university. If you are interested in volunteering and fit the criteria, please contact the organisers. Volunteers do not receive accommodation (residency). Anyone not invited to be a volunteer who signs up will have their registration cancelled."

  # --- Registration and payment ---
  - question: "Does the summer school sell out?"
    answer: "Yes, the summer school has sold out in previous years and we expect to sell out again this year. We recommend registering as soon as possible to secure your place."
  - question: "Can I reserve a place, or will places end before the dates?"
    answer: "Places are limited and we expect to sell out, so we recommend registering as soon as possible to secure your place. We are unable to reserve places without payment, so please register and pay to confirm your attendance."
  - question: "When will my place be confirmed?"
    answer: "Your place will be confirmed once you have completed the registration form and made the payment. You will receive a confirmation email with your registration details and receipt of payment. The school is based on a first come, first served basis with no applications or selection process, so once you have registered and paid, your place is confirmed."
  - question: "Can we pay by invoice?"
    answer: "Yes, you can pay by invoice. Please contact the organisers for more information. However, registration is only confirmed once payment is received, therefore payment should be processed immediately and we cannot abide by 30/60/90/etc. day payment periods."

  # --- Visas ---
  - question: "What visa do I need to attend the summer school?"
    answer: "If you are a non-UK citizen, you may need a visa to enter the UK. Please check the UK government website for visa requirements. We are unable to provide specific visa advice."

  # --- Posters ---
  - question: "Do all students need to bring posters?"
    answer: "The poster session is not mandatory, however, we greatly encourage students to bring posters to present their work and engage with other attendees. The poster session will also have prizes for the best posters!"
  - question: "Do I need to register / inform that I will be bringing a poster?"
    answer: "No, you do not need to let us know you will bring a poster. The poster session is open to all summer school registered attendees."
  - question: "What size poster should I prepare for the poster session?"
    answer: "The poster size should be A1 portrait (23.4 x 33.1 inches / 59.4 x 84.1 cm)."

  # --- Travel ---
  - question: "Is it possible to get parking?"
    answer: "Please email the event organisers at cvss-aberdeen@bmva.org and we will assist you."

